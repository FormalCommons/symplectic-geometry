name: tauceti-release

# The library follows Tau Ceti's security audit. Tau Ceti's branch
# security-audit marks how far along its main branch the source of each
# commit has been inspected (docs/security-audit.md there), and its rulesets
# let that branch only move forward. Once a day, this opens an issue for the
# agents when the branch has passed the commit the library pins and Tau
# Ceti's library, toolchain or dependencies have changed on the way, unless a
# move is open, or a move to that commit was closed (closing one skips the
# commit). Tau Ceti's version tags, one for each Lean release, are on audited
# commits, so the library does not wait for them. fc-worker counts this
# workflow's issues as the project's own: its config lists github-actions[bot]
# under `apps`. So everything the issue says is fixed text or a checked value,
# never text from Tau Ceti as it is. The issue gets the label merge-first:
# a move touches so many files that the merges of other pull requests would
# keep giving its pull request new conflicts, so fc-worker lets that pull
# request merge before all others once it is ready for review, and holds
# the others back meanwhile (fc-worker's README, *Merging one pull request
# first*). GitHub turns scheduled workflows off after 60 days without
# activity in the repository.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tauceti-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: open an issue for a later audited commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned=$(jq -r '.packages[] | select(.name == "TauCeti") | .rev' lake-manifest.json)
          [[ $pinned =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no Tau Ceti commit in lake-manifest.json"; exit 1; }
          audited=$(git ls-remote https://github.com/TauCetiProject/TauCeti refs/heads/security-audit | cut -f1)
          [[ $audited =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Tau Ceti has no branch security-audit"; exit 1; }
          if [ "$audited" = "$pinned" ]; then
            echo "the library is on Tau Ceti's audited commit, $pinned"
            exit 0
          fi
          # What the audited commit has and the pinned one does not: behind_by
          # counts the commits of the pinned one's history that the audited
          # one's lacks, and there are none while the pin is an audited commit
          # (CI's setup check sees to that when the pin moves).
          gh api "repos/TauCetiProject/TauCeti/compare/$pinned...$audited" >"$RUNNER_TEMP/compare.json"
          [ "$(jq '.behind_by' "$RUNNER_TEMP/compare.json")" = 0 ] ||
            { echo "::error::the pinned commit $pinned is not at or behind Tau Ceti's security-audit, $audited"; exit 1; }
          ahead=$(jq '.ahead_by' "$RUNNER_TEMP/compare.json")
          [[ $ahead =~ ^[0-9]+$ ]] || { echo "::error::unexpected comparison of $pinned with $audited"; exit 1; }
          # A move is for a change to what the library builds on. The
          # comparison lists at most 300 files, so a full list counts as one.
          listed=$(jq '.files | length' "$RUNNER_TEMP/compare.json")
          used=$(jq '[.files[] | .filename, (.previous_filename // empty) | select(test("^(TauCeti/|TauCeti\\.lean$|lean-toolchain$|lake-manifest\\.json$|lakefile\\.(toml|lean)$)"))] | length' "$RUNNER_TEMP/compare.json")
          if [ "$used" = 0 ] && [ "$listed" -lt 300 ]; then
            echo "Tau Ceti's audit is at $audited, $ahead commits on, with no change to its library, toolchain or dependencies"
            exit 0
          fi
          short=${audited:0:12}
          # Only this workflow's issues count: anyone can open and close an
          # issue in a public repository, but only the project can close the
          # workflow's. --author keeps the limit for them alone; in the
          # answer the author's login is app/github-actions.
          ours='.[] | select(.author.login == "app/github-actions") | .title'
          if gh issue list --author "github-actions[bot]" --state open --limit 1000 --json author,title --jq "$ours" | grep -q '^Move Tau Ceti to '; then
            echo "a move of Tau Ceti is open already"
            exit 0
          fi
          if gh issue list --author "github-actions[bot]" --state closed --limit 1000 --json author,title --jq "$ours" | grep -qxF "Move Tau Ceti to $short"; then
            echo "the move to $short was closed, which skips it"
            exit 0
          fi
          toolchain=$(gh api "repos/TauCetiProject/TauCeti/contents/lean-toolchain?ref=$audited" -H "Accept: application/vnd.github.raw")
          [[ $toolchain =~ ^leanprover/lean4:v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] ||
            { echo "::error::unexpected lean-toolchain at Tau Ceti's $short"; exit 1; }
          # CI's setup check rejects a move to a commit where Tau Ceti has a
          # lakefile.lean, which Lake would run and the audit does not read.
          # Such a move is a maintainer's decision, not an issue.
          files=$(gh api "repos/TauCetiProject/TauCeti/contents?ref=$audited" --jq '.[].name') ||
            { echo "::error::could not list Tau Ceti's files at $short"; exit 1; }
          { grep -qx 'lakefile\.toml' <<<"$files" && ! grep -qx 'lakefile\.lean' <<<"$files"; } ||
            { echo "::error::Tau Ceti at $short is not set up by a lakefile.toml alone, so CI would reject the move"; exit 1; }
          # gh issue create fails if the label is missing, so make it if
          # someone deleted it; this fails when it exists, which is fine.
          gh label create merge-first --color B60205 --description "Merges before all others; on an issue, the pull request that closes it does (fc-worker)" 2>/dev/null || true
          gh issue create --title "Move Tau Ceti to $short" --label merge-first --body "$(cat <<EOF
          Tau Ceti's security audit has reached commit \`$audited\` of its main branch, $ahead commits after \`$pinned\`, which the library is on. Move the library to this commit, as \`AGENTS.md\` says under *Leave the setup alone*:

          1. In \`lakefile.toml\`, set Tau Ceti's \`rev\` to \`$audited\`, with no comment after it. Change nothing else in the file.
          2. Set \`lean-toolchain\` to \`$toolchain\`, Tau Ceti's at that commit.
          3. Run \`lake update TauCeti\`. \`lake-manifest.json\` then pins Tau Ceti at that commit, and every other package as Tau Ceti's own manifest does; CI checks this.
          4. Build, and fix what breaks in the library, in the same pull request, however large: main must build at every commit, so a move is never split. Tau Ceti keeps no deprecated names, so the library follows renamed and removed declarations. Where Tau Ceti now has a declaration under the name of one of the library's own, remove the library's if Tau Ceti's says the same, and rename the library's if not.
          5. The files taken from Tau Ceti have Tau Ceti's header, not the library's: a copy at Tau Ceti's path, or a sibling \`FromTauCeti.lean\` (\`AGENTS.md\`, *Files*). Delete each of them all of whose declarations Tau Ceti has at this commit, whether or not it breaks the build, and import Tau Ceti's file where the library imported the copy. Where Tau Ceti has only some of a copy's declarations, remove those from the copy, import Tau Ceti's file in it, and say so in its module docstring; its header and the rest of it stay, names included. Leave the other copies as they are.
          6. The library defers to Tau Ceti and repeats nothing of it (\`AGENTS.md\`, *Use what exists*), and steps 4 and 5 remove only what shares a name or is a copy. So once the pull request is open, create the issues that remove the rest: one for each top-level directory of \`TauCeti/\` in which this move adds or changes files (\`git -C .lake/packages/TauCeti diff --stat $pinned $audited -- TauCeti/\`), titled "Use Tau Ceti \`$short\`: \`<directory>\`" and labelled \`proposed\`. Mark each as blocked by this issue, so that it waits for the merge. Each says which files of Tau Ceti it covers and how to list them, and asks this: for every declaration that those files gained or changed in the move, search the whole library for the same definition, statement or notion under any name, \`private\` lemmas and steps proved inside longer proofs included. Remove the library's, and move every use to Tau Ceti's. Keep only what says more than Tau Ceti's, restated on top of it, and name it in the description.

          Move to this commit even if Tau Ceti's audit moves on meanwhile: this workflow opens the next move once this issue is closed. Closing this issue without a move skips this commit.

          The audit says nothing of whether Tau Ceti builds. If the Tau Ceti modules that the library imports do not build at this commit, open no pull request: comment here what fails, label this issue \`needs-human\`, and stop. A maintainer then closes it.

          Opened by the tauceti-release workflow.
          EOF
          )"
