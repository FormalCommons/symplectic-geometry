name: cache

# Saves builds on main for CI to restore. Only this workflow saves; GitHub
# lets runs on any branch restore main's caches, and a run of CI could not
# save one for later runs: a pull request's run and a merge queue's run can
# restore only their own saves and main's.
#
# The three jobs do not wait for each other, and each has its own queue, so
# a slow run of one does not hold up the saves of another.
#
# The first job builds the dependencies that the library imports: Mathlib's
# files from its cache, and the Tau Ceti modules that the library's files
# import, which `lake exe cache get` does not fetch. When it starts without
# a save, as after a move of Tau Ceti, it takes those modules from Tau Ceti's
# build cache where that has them, and compiles the rest; see the setup
# action. It builds only those dependencies, never the library's own code,
# and saves again only when the list of Tau Ceti modules that the library
# imports has changed. Until it has saved, the other jobs and CI compile the
# modules that the latest save lacks.
#
# The second job keeps a build of the library, `.lake/build`, close to main:
# it restores the latest save, builds what main has changed since, and saves
# again. CI restores the latest of these saves, and Lake then builds only the
# files that differ from it and the files that import them, directly or
# through other files. Lake takes a file's build from a save only if the hash
# of the file's source, of its imports' builds, of the toolchain and of the
# options is the one recorded with that build; it does not go by the files'
# times.
#
# The third job builds main from its source, with no build of the library
# restored, and saves that build. It does so when the latest such build
# began an hour ago or more, so about once an hour while pull requests merge,
# and whenever a run is started by hand. The second job starts from the
# latest build from source, or from the latest save that descends from it.
# So each of its saves descends from the build from source that is the
# latest when the job starts. While pull requests merge and both jobs
# succeed, that build is at most a few hours old; the first run after a
# quiet spell still starts from the build before it. While there is no build
# from source for the current dependencies, as in the first runs after a
# move of Tau Ceti, the second job starts from the latest save of any kind.
#
# If the build from source fails, it saves nothing, and the next run tries
# again. So a run of this workflow that fails at the third job's build step
# says that main does not build from its source. The second job then goes on
# from the last build from source that succeeded, and warns in its log once
# that build is more than three hours old.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No job is cancelled once it runs, so a save that has begun always
# finishes. Each job waits only for a running job of its own kind on the
# same branch, and GitHub keeps only the newest waiting one. A run started
# by hand on another branch does not hold up main's.
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: cache-dependencies-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: name the saves
        id: names
        uses: ./.github/actions/setup-lean
        with:
          names-only: true
      # The key of the save names the list of imported Tau Ceti modules.
      - name: look for a save with these modules
        id: look
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: ${{ steps.names.outputs.packages }}-${{ steps.names.outputs.imports }}
          lookup-only: true
      # elan, then the latest save, or Mathlib's build cache and Tau Ceti's
      # without one.
      - name: set up Lean and restore the latest save
        if: steps.look.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-lean
      - name: build the imported Tau Ceti modules
        if: steps.look.outputs.cache-hit != 'true'
        run: |
          mapfile -t modules < <(sed 's/^/+/' "$RUNNER_TEMP/tauceti-imports.txt")
          if [ ${#modules[@]} -gt 0 ]; then lake build "${modules[@]}"; fi
      - name: save the built dependencies
        if: steps.look.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lake/packages
          key: ${{ steps.names.outputs.packages }}-${{ steps.names.outputs.imports }}

  # Saves only `.lake/build`. The dependencies come from the first job's
  # latest save, as in CI. After a move of Tau Ceti there is none yet, and
  # the setup then takes as long here as in CI, hence the limit.
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: cache-library-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: set up Lean and restore the built dependencies
        id: setup
        uses: ./.github/actions/setup-lean
      # The name of a build from source has the time it began, in seconds.
      - name: look for the latest build from source
        id: source
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: ${{ steps.setup.outputs.build }}-src-
          restore-keys: ${{ steps.setup.outputs.build }}-src-
          lookup-only: true
      # A save of this job is named after the build from source that it
      # descends from, then the commit and the run. It starts from the latest
      # save with that name, or from the build from source itself. While
      # there is no build from source, it starts from the latest save there
      # is.
      - name: name the save
        id: name
        env:
          BUILD: ${{ steps.setup.outputs.build }}
          SOURCE: ${{ steps.source.outputs.cache-matched-key }}
        run: |
          if [ -n "$SOURCE" ]; then
            from=${SOURCE#"$BUILD-src-"}
            from=${from%%-*}
            printf '%s\n' "from=$from" 'restore<<END' "$BUILD-inc-$from-" "$BUILD-src-$from-" END >> "$GITHUB_OUTPUT"
            if [[ $from =~ ^[0-9]+$ ]] && [ $(( $(date +%s) - from )) -ge 10800 ]; then
              echo "::warning::The latest build of main from its source began $(( ($(date +%s) - from) / 60 )) minutes ago. That is expected after hours without a merge. Otherwise see the job 'source' of the latest runs of this workflow."
            fi
          else
            printf '%s\n' 'from=none' "restore=$BUILD-" >> "$GITHUB_OUTPUT"
          fi
      - name: restore the latest build of the library
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: ${{ steps.setup.outputs.build }}-inc-${{ steps.name.outputs.from }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.name.outputs.restore }}
      - name: build
        run: lake build --wfail
      - name: save the build of the library
        uses: actions/cache/save@v6
        with:
          path: .lake/build
          key: ${{ steps.setup.outputs.build }}-inc-${{ steps.name.outputs.from }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Builds main from its source and saves `.lake/build`, when the latest
  # build from source began an hour ago or more, or when the run is started
  # by hand. The limit is as for the second job.
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: cache-source-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: name the saves
        id: names
        uses: ./.github/actions/setup-lean
        with:
          names-only: true
      - name: look for the latest build from source
        id: look
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: ${{ steps.names.outputs.build }}-src-
          restore-keys: ${{ steps.names.outputs.build }}-src-
          lookup-only: true
      # The clock is read here, which is after any wait for an earlier run
      # of this job, and the time goes into the name of the save.
      - name: see whether a build from source is due
        id: due
        env:
          BUILD: ${{ steps.names.outputs.build }}
          SOURCE: ${{ steps.look.outputs.cache-matched-key }}
        run: |
          now=$(date +%s)
          last=${SOURCE#"$BUILD-src-"}
          last=${last%%-*}
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! [[ $last =~ ^[0-9]+$ ]] || [ $(( now - last )) -ge 3600 ]; then
            echo "key=$BUILD-src-$now-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      - name: set up Lean and restore the built dependencies
        if: steps.due.outputs.key != ''
        uses: ./.github/actions/setup-lean
      - name: build
        if: steps.due.outputs.key != ''
        run: lake build --wfail
      - name: save the build of the library
        if: steps.due.outputs.key != ''
        uses: actions/cache/save@v6
        with:
          path: .lake/build
          key: ${{ steps.due.outputs.key }}
