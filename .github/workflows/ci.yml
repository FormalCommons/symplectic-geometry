name: ci

on:
  pull_request:
  merge_group:

# CI runs the build scripts of every pull request's branch, so it gets no
# secrets and only read access. It restores the dependencies that the cache
# workflow built on main, but never saves a cache itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Tau Ceti's rules for source text (see AGENTS.md), so that the library
      # can move there. This reads the files and runs nothing from them.
      - name: check the source
        run: |
          fail=0
          mapfile -t files < <(git ls-files '*.lean')
          [ ${#files[@]} -gt 0 ] || exit 0
          report() { echo "::error::$1"; fail=1; }
          grep -HnE '\b(set_option|unsafe|native_decide|initialize|builtin_initialize|run_cmd|run_elab|run_tac|run_meta|by_elab|count_heartbeats|guard_min_heartbeats|ofReduceBool|ofReduceNat|meta|elab|elab_rules)\b|#eval|\+native\b|\bnative\s*:=\s*true|(@|\battribute\s*)\[[^]]*\b(tactic|term_elab|command_elab|macro|delab|app_unexpander|init)\b' "${files[@]}" \
            && report "The lines above use a command or word that AGENTS.md rules out. The check reads comments too."
          grep -HnE '^\s*(@\[[^]]*\]\s*)?((public|private|protected)\s+)?axiom\s+\S+(\s*[:({[]|\s*$)' "${files[@]}" \
            && report "The lines above declare an axiom."
          grep -HnE '\bmacro(_rules)?\b' "${files[@]}" | grep -vE '\blocal\s+macro(_rules)?\b' \
            && report "The lines above define a macro that is not local."
          grep -HnE '^\s*(public\s+)?import\s+((Mathlib|TauCeti|Mathlib\.Tactic)\s*($|--)|(Lean|Lake|Mathlib\.Lean)(\.|\s|$))' "${files[@]}" \
            && report "The lines above import a whole library, or Lean or Lake. Import the specific modules."
          for f in "${files[@]}"; do
            awk '
              NR == 1 && $0 != "/-" { exit 1 }
              NR == 2 && $0 !~ /^Copyright \(c\) [0-9][0-9][0-9][0-9] .+\. All rights reserved\.$/ { exit 1 }
              NR == 3 && $0 != "Released under Apache 2.0 license as described in the file LICENSE." { exit 1 }
              NR == 4 && $0 !~ /^Authors: ./ { exit 1 }
              NR == 5 && $0 != "-/" { exit 1 }
              NR > 5 && NF { exit ($0 == "module" ? 0 : 1) }
              END { if (NR <= 5) exit 1 }' "$f" \
              || report "$f must start with the copyright header in AGENTS.md, then module."
          done
          exit $fail
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The latest save for this lean-toolchain and lake-manifest.json; see
      # the cache workflow.
      - name: restore the built dependencies
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: lake-packages-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: lake-packages-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: fetch Mathlib's build cache
        if: steps.restore.outputs.cache-matched-key == ''
        run: lake exe cache get
      # --wfail fails the build on any warning, including a `sorry`.
      - name: build
        run: lake build --wfail
