name: ci

on:
  pull_request:
  merge_group:

# CI runs the build scripts of every pull request's branch, so it gets no
# secrets and only read access. It restores the dependencies and the build of
# the library that the cache workflows saved on main, but never saves a cache
# itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A move of Tau Ceti finds no save of the dependencies and none of the
    # library's build, since lake-manifest.json is in the names of both. Its
    # run fetches what Tau Ceti's build cache has, compiles the Tau Ceti
    # modules that the cache does not have as they are at the new commit,
    # and builds the library from its source. That can take more than an
    # hour. If Tau Ceti's cache has nothing for the new commit, the run
    # compiles all of those modules, which has not been timed on a runner;
    # the limit leaves room for it. The merge queue waits as long for a
    # check (the ruleset's limit).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      # The setup follows Tau Ceti. lakefile.toml must be .github/lakefile.toml
      # but for Tau Ceti's rev; lean-toolchain, and every other package in
      # lake-manifest.json, must be as Tau Ceti has them at that commit. So a
      # move of Tau Ceti can change only that. A move goes forward to a commit
      # that Tau Ceti's security audit has inspected: its branch
      # security-audit marks how far along the first-parent history of its
      # main branch the audit has come (docs/security-audit.md there), and the
      # new rev must be on that history, after the base branch's rev and at or
      # behind the branch. This reads files and runs nothing from them.
      - name: check the setup
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Lake would read a lakefile.lean instead of lakefile.toml.
          [ ! -e lakefile.lean ] || { echo "::error::the setup is lakefile.toml; remove lakefile.lean"; exit 1; }
          # A rev has no comment after it. The one exception is the rev that
          # was a version tag's, in lakefile.toml, which keeps its comment
          # until the first move: a maintainer then removes the exception.
          rev='rev = "[0-9a-f]{40}"'
          was_tag='rev = "e0e414ce57522ba17560057ad0d7f2edab91bf0c" # tag v4\.37\.0-rc1'
          diff <(sed -E "s/^$rev\$/rev = (Tau Ceti)/" .github/lakefile.toml) \
               <(sed -E "s/^($rev|$was_tag)\$/rev = (Tau Ceti)/" lakefile.toml) ||
            { echo "::error::lakefile.toml differs from .github/lakefile.toml in more than Tau Ceti's rev"; exit 1; }
          pin=$(sed -nE 's/^rev = "([0-9a-f]{40})".*/\1/p' lakefile.toml)
          # The base branch's rev passed this check when it was set, so only
          # a pull request that changes it, a move, is checked further.
          was=$(gh api "repos/$GITHUB_REPOSITORY/contents/lakefile.toml?ref=$BASE" -H "Accept: application/vnd.github.raw" |
            sed -nE 's/^rev = "([0-9a-f]{40})".*/\1/p' || true)
          [[ -n $BASE && $was =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no rev of Tau Ceti's in the base branch's lakefile.toml"; exit 1; }
          if [ "$pin" != "$was" ]; then
            # The commits of security-audit, without their files. Those
            # along the first parents that come after the base branch's rev
            # are the audited commits a move can go to: not a commit of a
            # branch that main merged, which the audit did not inspect as it
            # is, and not an earlier commit. The list has the latest first,
            # and its order decides: commit dates do not always follow it.
            git init -q --bare "$RUNNER_TEMP/tauceti.git"
            git -C "$RUNNER_TEMP/tauceti.git" fetch -q --filter=tree:0 \
              https://github.com/TauCetiProject/TauCeti security-audit ||
              { echo "::error::could not fetch Tau Ceti's branch security-audit"; exit 1; }
            git -C "$RUNNER_TEMP/tauceti.git" rev-list --first-parent FETCH_HEAD |
              awk -v pin="$pin" -v was="$was" '$0 == pin { p = NR } $0 == was { w = NR } END { exit !(p && w && p < w) }' ||
              { echo "::error::Tau Ceti's rev $pin is not on the first-parent history of Tau Ceti's branch security-audit after the base branch's rev $was"; exit 1; }
            # The audit reads Tau Ceti's library, not its Lake configuration,
            # and Lake would run a lakefile.lean of Tau Ceti's.
            files=$(gh api "repos/TauCetiProject/TauCeti/contents?ref=$pin" --jq '.[].name') ||
              { echo "::error::could not list Tau Ceti's files at $pin"; exit 1; }
            { grep -qx 'lakefile\.toml' <<<"$files" && ! grep -qx 'lakefile\.lean' <<<"$files"; } ||
              { echo "::error::Tau Ceti at $pin is not set up by a lakefile.toml alone"; exit 1; }
          fi
          upstream() { gh api "repos/TauCetiProject/TauCeti/contents/$1?ref=$pin" -H "Accept: application/vnd.github.raw"; }
          [ "$(cat lean-toolchain)" = "$(upstream lean-toolchain)" ] ||
            { echo "::error::lean-toolchain differs from Tau Ceti's at $pin"; exit 1; }
          upstream lake-manifest.json >"$RUNNER_TEMP/tauceti-manifest.json"
          jq -e --arg pin "$pin" --slurpfile up "$RUNNER_TEMP/tauceti-manifest.json" '
            ([.packages[] | select(.name == "TauCeti") | [.url, .rev]] == [["https://github.com/TauCetiProject/TauCeti", $pin]])
            and all(.packages[] | select(.name != "TauCeti"); .inherited)
            and ([.packages[] | select(.name != "TauCeti") | del(.inherited)] | sort_by(.name))
              == ([$up[0].packages[] | del(.inherited)] | sort_by(.name))' lake-manifest.json >/dev/null ||
            { echo "::error::lake-manifest.json does not pin Tau Ceti at $pin and the other packages as Tau Ceti does"; exit 1; }
      # Tau Ceti's rules for source text (see AGENTS.md), so that the library
      # can move there. This reads the files and runs nothing from them.
      - name: check the source
        run: |
          fail=0
          mapfile -t files < <(git ls-files '*.lean')
          [ ${#files[@]} -gt 0 ] || exit 0
          report() { echo "::error::$1"; fail=1; }
          grep -HnE '\b(set_option|unsafe|native_decide|initialize|builtin_initialize|run_cmd|run_elab|run_tac|run_meta|by_elab|count_heartbeats|guard_min_heartbeats|ofReduceBool|ofReduceNat|meta|elab|elab_rules)\b|#eval|\+native\b|\bnative\s*:=\s*true|(@|\battribute\s*)\[[^]]*\b(tactic|term_elab|command_elab|macro|delab|app_unexpander|init)\b' "${files[@]}" \
            && report "The lines above use a command or word that AGENTS.md rules out. The check reads comments too."
          grep -HnE '^\s*(@\[[^]]*\]\s*)?((public|private|protected)\s+)?axiom\s+\S+(\s*[:({[]|\s*$)' "${files[@]}" \
            && report "The lines above declare an axiom."
          grep -HnE '\bmacro(_rules)?\b' "${files[@]}" | grep -vE '\blocal\s+macro(_rules)?\b' \
            && report "The lines above define a macro that is not local."
          grep -HnE '^\s*(public\s+)?import\s+((Mathlib|TauCeti|Mathlib\.Tactic)\s*($|--)|(Lean|Lake|Mathlib\.Lean)(\.|\s|$|--|/-))' "${files[@]}" \
            && report "The lines above import a whole library, or Lean or Lake. Import the specific modules."
          for f in "${files[@]}"; do
            awk '
              NR == 1 && $0 != "/-" { exit 1 }
              NR == 2 && $0 !~ /^Copyright \(c\) [0-9][0-9][0-9][0-9] .+\. All rights reserved\.$/ { exit 1 }
              NR == 3 && $0 != "Released under Apache 2.0 license as described in the file LICENSE." { exit 1 }
              NR == 4 && $0 !~ /^Authors: ./ { exit 1 }
              NR == 5 && $0 != "-/" { exit 1 }
              NR > 5 && NF { exit ($0 == "module" ? 0 : 1) }
              END { if (NR <= 5) exit 1 }' "$f" \
              || report "$f must start with the copyright header in AGENTS.md, then module."
          done
          exit $fail
      # elan, then the latest save of the built dependencies, or Mathlib's
      # build cache and Tau Ceti's without one; see the workflow
      # cache-dependencies.
      - name: set up Lean and restore the built dependencies
        id: setup
        uses: ./.github/actions/setup-lean
      # main's latest build of the library: the latest save of the workflow
      # cache-library, which follows main (`-inc-`) and is a few commits
      # behind, or without one the latest save of any kind. Lake takes a
      # file's build from it only if the file's source, its imports' builds,
      # the toolchain and the options are as they were for that build, and
      # builds every other file. Without a save it builds them all. The
      # workflow cache-source builds main from its source about once an
      # hour. GitHub looks for saves whose names begin with `key` before it
      # looks at `restore-keys`, so the kind to prefer is in `key`.
      - name: restore main's build of the library
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: ${{ steps.setup.outputs.build }}-inc-
          restore-keys: ${{ steps.setup.outputs.build }}-
      # --wfail fails the build on any warning, including a `sorry`.
      - name: build
        run: lake build --wfail
