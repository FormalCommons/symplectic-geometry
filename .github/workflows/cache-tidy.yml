name: cache-tidy

# Deletes the builds that the merge queue's runs of CI hand to the workflow
# cache-library as artifacts (see there), once main has passed them. When a
# run of cache-library for a commit of main has ended, no run asks again for
# the build of that commit or of a commit before it: each run takes only the
# build of its own commit, and the runs still to come are for later commits.
# A build is about 320 MB and about 40 pull requests merge in an hour, so
# without this some 300 GB would stand until GitHub deletes each build after
# a day, the shortest time it allows. The build of a commit that never
# reached main stays for that day.
#
# This is a workflow of its own for two reasons. Deleting an artifact needs
# `actions: write`, which also allows deleting saves and cancelling runs, so
# no job that builds has it: this one checks out nothing and runs no file of
# the repository, only the commands below, as they are on main. And the
# runs of cache-library take turns by waiting for the earlier run to end,
# so a second job there would make each turn longer.
#
# A run takes one request for the list of builds, one for main's commits if
# there is a build, and one for each build it deletes. It never fails: what
# it leaves, the next run deletes, or GitHub does after the day.
on:
  workflow_run:
    workflows: [cache-library]
    types: [completed]
    branches: [main]

# `contents: read` is for the list of main's commits.
permissions:
  contents: read
  actions: write

jobs:
  tidy:
    # Only for a run of cache-library that a push to main started.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: delete the merge queue's builds that main has passed
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || { echo "::notice::no commit of the run of cache-library, so this run deletes nothing"; exit 0; }
          # Asking how many requests are left is not itself counted as one.
          # The run leaves the other workflows more than the reserve of
          # cache-turn.sh.
          left=$(timeout 60 gh api rate_limit --jq '.resources.core.remaining') || left=
          if ! [[ $left =~ ^[0-9]+$ ]] || [ "$left" -lt 400 ]; then
            echo "::notice::${left:-an unknown number of} requests to GitHub are left to the workflows for this hour, so this run deletes nothing"
            exit 0
          fi
          timeout 60 gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name=queue-build -F per_page=100 \
            --jq '.artifacts[] | "\(.id) \(.workflow_run.head_sha)"' >"$RUNNER_TEMP/builds" ||
            { echo "::notice::could not list the merge queue's builds, so this run deletes nothing"; exit 0; }
          [ -s "$RUNNER_TEMP/builds" ] || { echo "GitHub lists no build of the merge queue"; exit 0; }
          # The 100 latest commits of main up to the one that the run of
          # cache-library was for.
          timeout 60 gh api -X GET "repos/$GITHUB_REPOSITORY/commits" -f sha="$COMMIT" -F per_page=100 \
            --jq '.[].sha' >"$RUNNER_TEMP/main" ||
            { echo "::notice::could not list main's commits, so this run deletes nothing"; exit 0; }
          deleted=0
          while read -r id sha; do
            grep -qxF "$sha" "$RUNNER_TEMP/main" || continue
            if timeout 60 gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null; then
              deleted=$((deleted + 1))
            else
              echo "could not delete the build of $sha"
            fi
          done <"$RUNNER_TEMP/builds"
          echo "deleted $deleted of the $(wc -l <"$RUNNER_TEMP/builds") builds that GitHub lists"
