# Lake's cache services for this repository's workflows, which name this file
# in LAKE_CONFIG. Both are the bucket `formalcommons-lake-cache` of Hetzner
# Object Storage. Under `a/` it holds build archives, one for each module,
# named by the hash of their content. Under `r/` it holds mappings: for a
# commit, which archive each module builds to. A build that finds a mapping
# for a module's inputs fetches the archive and does not compile.
#
# Anyone can read the bucket, and Lake reads it without a key. Only the
# workflow cache-upload writes to it; see there.
#
# `fc-queue`: the mappings of the commits of main, as the merge queue built
# them. `fc-pr`: the mappings of the runs of pull requests, by head commit.
# The archives are shared.

[[cache.service]]
name = "fc-queue"
kind = "s3"
artifactEndpoint = "https://formalcommons-lake-cache.fsn1.your-objectstorage.com/a"
revisionEndpoint = "https://formalcommons-lake-cache.fsn1.your-objectstorage.com/r/queue"
hasPackageScopes = false

[[cache.service]]
name = "fc-pr"
kind = "s3"
artifactEndpoint = "https://formalcommons-lake-cache.fsn1.your-objectstorage.com/a"
revisionEndpoint = "https://formalcommons-lake-cache.fsn1.your-objectstorage.com/r/pr"
hasPackageScopes = false
