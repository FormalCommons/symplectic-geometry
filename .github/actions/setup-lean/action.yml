name: set up Lean
description: >-
  Names the saves that the cache workflows make and CI restores, lists the
  Tau Ceti modules that the library imports, installs elan, and restores the
  built dependencies.

# The steps and the names of the saves that the jobs of ci.yml and of the
# three cache workflows (cache-dependencies, cache-library, cache-source)
# share, written once, so that the jobs cannot come to differ. A job that
# restores under another name than the one the saves have fails nothing: it
# finds no save and builds everything.
inputs:
  names-only:
    description: >-
      With 'true', only names the saves and lists the imported Tau Ceti
      modules, and installs and restores nothing.
    default: 'false'
  bucket:
    description: >-
      With 'true', a job that finds no save of the dependencies also looks
      in the bucket of Lake's cache for the Tau Ceti modules, and writes the
      mappings of those it built. Only ci.yml asks for this.
    default: 'false'
outputs:
  # A save of `.lake/packages` has this name, then a hash of the list of Tau
  # Ceti modules that the library imports.
  packages:
    description: The start of the name of the saves of the built dependencies.
    value: ${{ steps.names.outputs.packages }}
  # The list itself is the file tauceti-imports.txt in the runner's temporary
  # directory, one module on a line.
  imports:
    description: A hash of the list of Tau Ceti modules that the library imports.
    value: ${{ steps.names.outputs.imports }}
  # A save of `.lake/build` has this name, then its kind (`-src-` for a
  # build from source, `-inc-` for one that follows main), the time at
  # which the build from source began that it is or descends from (`none`
  # without one), the commit and the run; see the workflow cache-library.
  # lakefile.toml is in the hash because Lake's record of a build does not
  # cover everything a lakefile can set.
  build:
    description: The start of the name of the saves of the library's build.
    value: ${{ steps.names.outputs.build }}
  # With `bucket`, after a build of the Tau Ceti modules that wrote its
  # mappings: the file tauceti-mappings.jsonl in the runner's temporary
  # directory. What tauceti-bucket.sh found is in tauceti-bucket there.
  tauceti-mappings:
    description: "'true' if the build of the Tau Ceti modules wrote its mappings."
    value: ${{ steps.tauceti.outputs.mappings }}
runs:
  using: composite
  steps:
    - name: name the saves
      id: names
      shell: bash
      run: |
        echo "packages=lake-packages-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}" >> "$GITHUB_OUTPUT"
        echo "build=lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}" >> "$GITHUB_OUTPUT"
        .github/tauceti-cache.sh --imports > "$RUNNER_TEMP/tauceti-imports.txt"
        echo "imports=$(sha256sum "$RUNNER_TEMP/tauceti-imports.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: install elan
      if: inputs.names-only != 'true'
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
          | sh -s -- -y --no-modify-path --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    # The latest save for this lean-toolchain and lake-manifest.json; see the
    # workflow cache-dependencies.
    - name: restore the built dependencies
      id: restore
      if: inputs.names-only != 'true'
      uses: actions/cache/restore@v6
      with:
        path: .lake/packages
        key: ${{ steps.names.outputs.packages }}
        restore-keys: ${{ steps.names.outputs.packages }}-
    - name: fetch Mathlib's build cache
      if: inputs.names-only != 'true' && steps.restore.outputs.cache-matched-key == ''
      shell: bash
      run: lake exe cache get
    # Without a save, which is the case after a move of Tau Ceti, the build
    # would compile every Tau Ceti module that the library imports, and those
    # that they import: some thousands, which a runner does not finish in an
    # hour. Tau Ceti publishes the builds of some of its commits in a public
    # cache, which Lake reads without a key; Mathlib's files are not in it.
    # Lake looks for the list of the pinned commit's builds, then for that
    # of each commit before it, as `git rev-list` orders them, 500 commits
    # in all, and takes the first it finds. `lake build` then fetches each
    # module that the list has as the pinned commit would build it, with the
    # same source and the same imports, and compiles the others: those that
    # changed since, and those that import them. Only this step reads the
    # cache. A later build without the cache accepts what the step leaves in
    # `.lake/packages` and compiles nothing again, so the steps after it,
    # and a save of `.lake/packages`, work as before. If the cache has
    # nothing or cannot be read, the step gives a warning and compiles the
    # modules itself; if its build fails, it gives a warning, and the build
    # that follows compiles what is missing. If Lake fails before it asks
    # the cache, the step tries again for 5 minutes before it compiles the
    # modules itself. The script is the one that the agents' jobs run, and
    # on a runner it has no other job to wait for.
    #
    # Tau Ceti's cache has builds of some commits only. After the move to
    # 0aaa80fd it had them for an earlier commit, and each run compiled 2,047
    # modules, for an hour. So a run of CI (`bucket`) first looks for the
    # modules in the bucket that the workflow cache-upload fills, where an
    # earlier run's are: see tauceti-bucket.sh for whose it may read. The
    # step below then fetches them, compiles only what is still missing, and
    # writes the mappings of the Tau Ceti modules it built, which ci.yml
    # hands to cache-upload. The cache workflows do not ask for this: main's
    # save of the dependencies comes from Tau Ceti's source and its own
    # cache alone.
    - name: look for the Tau Ceti modules in the bucket
      if: inputs.bucket == 'true' && inputs.names-only != 'true' && steps.restore.outputs.cache-matched-key == ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_REPO: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
        PR: ${{ github.event.pull_request.number }}
        QUEUE_REF: ${{ github.event.merge_group.head_ref }}
      run: .github/tauceti-bucket.sh find "$RUNNER_TEMP/tauceti-bucket"
    - name: take the imported Tau Ceti modules from Tau Ceti's build cache
      id: tauceti
      if: inputs.names-only != 'true' && steps.restore.outputs.cache-matched-key == ''
      shell: bash
      env:
        LAKE_ARTIFACT_CACHE: 'true'
        LAKE_CACHE_DIR: ${{ runner.temp }}/lake-cache
        TAUCETI_CACHE_BUILD_LIMIT: 90m
        TAUCETI_BUCKET_MAPPINGS: ${{ inputs.bucket == 'true' && format('{0}/tauceti-bucket/mappings.jsonl', runner.temp) || '' }}
        TAUCETI_MAPPINGS_OUT: ${{ inputs.bucket == 'true' && format('{0}/tauceti-mappings.jsonl', runner.temp) || '' }}
      run: |
        .github/tauceti-cache.sh
        [ ! -s "$TAUCETI_MAPPINGS_OUT" ] || echo "mappings=true" >> "$GITHUB_OUTPUT"
