name = "SymplecticGeometry"
defaultTargets = ["SymplecticGeometry"]

# Tau Ceti's options, so that code here can later move to Tau Ceti unchanged:
# Mathlib's standard linters, a 1500-line limit per file, and every warning an
# error. Both file-length options must be set, or the linter asks for a
# `set_option` in every file.
[leanOptions]
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.unusedVariables.analyzeTactics = true
weak.linter.style.longFile = 1500
weak.linter.style.longFileDefValue = 1500
weak.linter.style.header = true
warningAsError = true

# Tau Ceti, which brings Mathlib, at a fixed commit. Its own lake-manifest.json
# pins Mathlib and the rest, and this project's lake-manifest.json records them.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "c9d170eed5a83c81de038eb30829b2de8c3baaf4"

[[lean_lib]]
name = "SymplecticGeometry"
# Build every module under `SymplecticGeometry/`. There is no root file that imports them
# all, so pull requests that add files never conflict over one.
globs = ["SymplecticGeometry.+"]
